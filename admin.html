<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Larry Admin 0799302643</title><style>body{background:#000;color:#fff;font-family:Arial;padding:12px} .box{background:#111;padding:20px;border-radius:12px;max-width:600px;margin:auto;border:2px solid #00ff88} input{width:90%;padding:12px;margin:8px;border-radius:8px;border:none} button{padding:12px;width:95%;background:#00ff88;border:none;border-radius:8px;font-weight:bold;margin:6px} .entry{background:#002a12;padding:10px;margin:8px 0;border-radius:8px;border-left:4px solid #00ff88} .hidden{display:none}</style></head><body><div class="box" id="login"><h2 style="color:#00ff88">🔒 LARRY ADMIN</h2><p>Enter password to view clients</p><input id="pass" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><p style="font-size:12px;color:#888">Hint: Your M-Pesa last 4 digits + RVTTI = 2643RVTTI</p></div><div class="box hidden" id="dash"><h2 style="color:#00ff88">CLIENTS DASHBOARD</h2><p>Total Quotes: <span id="count">0</span> | Total Value: KSH <span id="tval">0</span></p><button onclick="clearData()" style="background:#ff4444;color:#fff">Clear All</button><div id="list"></div><button onclick="exportCSV()" style="background:#ffcc00">📥 Download CSV</button></div><script>function login(){if(document.getElementById('pass').value==='2643RVTTI'){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');load();}else{alert('Wrong password! Use 2643RVTTI');}}function load(){let data=JSON.parse(localStorage.getItem('larry_quotes')||'[]');document.getElementById('count').innerText=data.length;let sum=data.reduce((a,b)=>a+b.tot,0);document.getElementById('tval').innerText=sum.toLocaleString();let h='';data.reverse().forEach(d=>{h+=`<div class="entry"><b>${d.client}</b> - ${d.date}<br>${d.area}m² | Blocks: ${d.w}<br><b>KSH ${d.tot.toLocaleString()}</b><br><a href="https://wa.me/254${d.phone||'799302643'}?text=Hi ${d.client}" style="color:#00ff88">WhatsApp Client</a></div>`});document.getElementById('list').innerHTML=h||'<p>No clients yet</p>';}function clearData(){if(confirm('Delete all clients?')){localStorage.removeItem('larry_quotes');load();}}function exportCSV(){let data=JSON.parse(localStorage.getItem('larry_quotes')||'[]');let csv='Client,Area,Blocks,Total,Date\n';data.forEach(d=>{csv+=`${d.client},${d.area},${d.w},${d.tot},${d.date}\n`});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='larry_clients.csv';a.click();}</script></body></html>
